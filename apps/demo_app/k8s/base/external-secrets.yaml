# ExternalSecret (External Secrets Operator) - materializează Secret-urile
# Kubernetes "postgres-credentials" și "demo-app-secret" din Vault, la fiecare
# "refreshInterval" (§ documentatie.md, managementul secretelor). Manifestul
# nu conține nicio valoare sensibilă (doar CALEA din Vault) - poate fi
# comitat în git și sincronizat de Argo CD ca orice altă resursă, spre
# deosebire de Secret-ul rezultat, pe care ESO îl creează direct în cluster.
#
# "target.name" rămâne literal "postgres-credentials"/"demo-app-secret" (NU
# se prefixează automat de kustomize cu "dev-" în overlay-ul de dev, spre
# deosebire de ConfigMap/PVC - kustomize nu recunoaște acest câmp ca
# referință de nume) - exact numele așteptat de app.yaml/postgres.yaml
# (secretKeyRef), neschimbat între medii. Calea Vault ("remoteRef.key")
# diferă însă între medii - vezi overlays/dev/patch-vault-secrets.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: demo-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: demo-app/prod/postgres
        property: POSTGRES_USER
    - secretKey: POSTGRES_DB
      remoteRef:
        key: demo-app/prod/postgres
        property: POSTGRES_DB
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: demo-app/prod/postgres
        property: POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-secret
  namespace: demo-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: demo-app-secret
    creationPolicy: Owner
  data:
    - secretKey: FLASK_SECRET_KEY
      remoteRef:
        key: demo-app/prod/flask
        property: FLASK_SECRET_KEY

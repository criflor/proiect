<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Cont nou</title>
  <style>
    body { font-family: sans-serif; max-width: 320px; margin: 80px auto; }
    input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Cont nou</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="text" name="username" placeholder="Utilizator" required autofocus>
    <input type="password" name="password" placeholder="Parolă" required>
    <button type="submit">Creează cont</button>
  </form>
  <p><a href="{{ url_for('login') }}">Ai deja cont? Autentifică-te</a></p>
</body>
</html>

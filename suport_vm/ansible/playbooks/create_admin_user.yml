---
# Creează utilizatorul "adm" pe fiecare VM, cu autentificare SSH exclusiv pe bază de
# cheie publică (fără parolă). Rulare idempotentă: toate task-urile pot fi reaplicate
# fără efecte secundare.
- name: Configurare inițială - utilizator adm (doar SSH key)
  hosts: suport
  become: true

  # Excepție obligatorie: "adm" nu există încă la această rulare (tocmai el
  # se creează aici) - conectarea trebuie să folosească userul de bootstrap
  # din cloud-init ("admin"), nu implicitul "adm" din group_vars/all.yml
  # (valabil pentru toate CELELALTE playbook-uri, rulate după acesta). Un
  # "vars:" de play are prioritate peste group_vars.
  vars:
    ansible_user: admin

  tasks:
    - name: Citește cheia publică SSH de pe mașina de control
      ansible.builtin.set_fact:
        adm_ssh_public_key: "{{ lookup('file', adm_ssh_public_key_path) }}"

    # "adm" e și numele unui grup de sistem (folosit pt. acces la loguri) pe Ubuntu.
    # Dacă useradd ar încerca să creeze automat un grup omonim, ar eșua exact ca la
    # userul "adm"/"admin" din cloud-init mai devreme - de-aia fixăm explicit grupul
    # primar pe "users" (grup deja existent), evitând coliziunea.
    - name: Creează utilizatorul {{ adm_user }}
      ansible.builtin.user:
        name: "{{ adm_user }}"
        group: users
        shell: /bin/bash
        password: "!" # cont blocat: nicio autentificare cu parolă nu e posibilă
        create_home: true
        state: present

    - name: Adaugă cheia publică SSH pentru {{ adm_user }}
      ansible.posix.authorized_key:
        user: "{{ adm_user }}"
        key: "{{ adm_ssh_public_key }}"
        state: present
        exclusive: true

    - name: Permite {{ adm_user }} să folosească sudo fără parolă
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ adm_user }}"
        content: "{{ adm_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    # Dacă cloud-init a avut ssh_pwauth: true, generează un drop-in
    # (/etc/ssh/sshd_config.d/50-cloud-init.conf) cu "PasswordAuthentication yes",
    # inclus ÎNAINTEA sshd_config principal - deci ar câștiga în fața setării
    # de mai jos dacă nu-l eliminăm explicit.
    - name: Elimină eventualul drop-in sshd al cloud-init care ar reactiva parola
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/50-cloud-init.conf
        state: absent
      notify: Repornește sshd

    - name: Dezactivează autentificarea SSH prin parolă (doar chei)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PasswordAuthentication\s'
        line: "PasswordAuthentication no"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Repornește sshd

  handlers:
    - name: Repornește sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted

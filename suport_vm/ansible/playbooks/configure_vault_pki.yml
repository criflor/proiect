---
# Configurează Vault ca infrastructură PKI pentru tot proiectul: o rădăcină
# (root CA, ținută cât mai izolată - folosită DOAR ca să semneze intermediara)
# și o intermediară (pki_int, cea care emite efectiv certificate) - tiparul
# standard recomandat de HashiCorp, nu un singur CA plat. Certificatele
# clusterului (cert-manager, prin Issuer-ul Vault - vezi
# kubernetes_cluster/k3s/playbooks/16_configure_vault_pki_auth.yml) și cel al
# GitLab (mai jos, în install_gitlab.yml) sunt emise din aceeași intermediară.
- name: Configurare Vault PKI (root CA + intermediate CA)
  hosts: suport
  become: true

  vars:
    pki_root_max_ttl: "87600h" # 10 ani - rădăcina nu se reînnoiește practic niciodată
    pki_int_max_ttl: "43800h" # 5 ani
    pki_leaf_max_ttl: "8760h" # 1 an - certificatele emise efectiv (rol "kube-dev")
    pki_domain: kube-dev.local
    root_ca_file: "{{ playbook_dir }}/../../../kubernetes_cluster/k3s/files/gitlab-kube-dev-local-ca.crt"
    vault_data_dir: /opt/vault/data
    vault_config_dir: /etc/vault.d
    # Administrare Vault de pe chiar acest host - folosește listener-ul
    # intern de bootstrap (§ vezi install_vault.yml), nu adresa externă
    # (care, după acest playbook, devine HTTPS - dar acest playbook rulează
    # ÎNAINTE ca certificatul să existe, la prima instalare).
    vault_addr: "http://127.0.0.1:8201"

  tasks:
    - name: Citește tokenul root Vault
      ansible.builtin.slurp:
        src: "{{ vault_init_file }}"
      register: vault_root_read
      delegate_to: localhost
      become: false

    - name: Verifică ce motoare de secrete sunt deja activate
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/mounts"
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        return_content: true
      register: vault_mounts

    - name: Activează motorul PKI pentru rădăcină (root CA)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/mounts/pki"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          type: pki
          config:
            max_lease_ttl: "{{ pki_root_max_ttl }}"
        status_code: [200, 204]
      when: "'pki/' not in vault_mounts.json"

    - name: Activează motorul PKI pentru intermediară (pki_int)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/mounts/pki_int"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          type: pki
          config:
            max_lease_ttl: "{{ pki_int_max_ttl }}"
        status_code: [200, 204]
      when: "'pki_int/' not in vault_mounts.json"

    # "no_log" pe verificările PKI de mai jos nu ar ascunde nimic sensibil
    # (certificatele sunt publice prin definiție) - omis intenționat, spre
    # deosebire de parole/token-uri.
    - name: Verifică dacă rădăcina (root CA) a fost deja generată
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki/cert/ca"
        status_code: [200, 400, 404]
        return_content: true
      register: root_ca_check

    - name: Generează rădăcina (root CA, internă - cheia privată nu părăsește Vault-ul)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki/root/generate/internal"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          common_name: "kube-dev Root CA"
          ttl: "{{ pki_root_max_ttl }}"
          key_type: ec
          key_bits: 256
        status_code: 200
      when: root_ca_check.status != 200 or not root_ca_check.content

    - name: Configurează URL-urile PKI ale rădăcinii (issuing/CRL)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki/config/urls"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          issuing_certificates: "{{ vault_addr }}/v1/pki/ca"
          crl_distribution_points: "{{ vault_addr }}/v1/pki/crl"
        status_code: [200, 204]

    - name: Verifică dacă intermediara a fost deja semnată
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki_int/cert/ca"
        status_code: [200, 400, 404]
        return_content: true
      register: int_ca_check

    - name: Generează CSR-ul intermediarei (cheia privată rămâne în pki_int, nu iese din Vault)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki_int/intermediate/generate/internal"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          common_name: "kube-dev Intermediate CA"
          key_type: ec
          key_bits: 256
        status_code: 200
      register: int_csr_gen
      when: int_ca_check.status != 200 or not int_ca_check.content

    - name: Semnează CSR-ul intermediarei cu rădăcina
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki/root/sign-intermediate"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          csr: "{{ int_csr_gen.json.data.csr }}"
          format: pem_bundle
          ttl: "{{ pki_int_max_ttl }}"
        status_code: 200
      register: int_sign
      when: int_csr_gen is not skipped

    - name: Instalează certificatul semnat înapoi în pki_int
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki_int/intermediate/set-signed"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          certificate: "{{ int_sign.json.data.certificate }}\n{{ int_sign.json.data.issuing_ca }}"
        status_code: [200, 204]
      when: int_sign is not skipped

    # Rolul cu care se emit efectiv certificate (leaf) din intermediară -
    # limitat strict la domeniul proiectului, nu la orice nume cerut.
    # "key_type: ec" - folosit via "/issue" (Vault însuși generează cheia),
    # de install_gitlab.yml și de certificatul propriu al Vault-ului, mai jos.
    - name: Creează/actualizează rolul de emitere "kube-dev" pe intermediară
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki_int/roles/kube-dev"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          allowed_domains: "{{ pki_domain }}"
          allow_subdomains: true
          allow_bare_domain: true
          max_ttl: "{{ pki_leaf_max_ttl }}"
          key_type: ec
          key_bits: 256
          server_flag: true
          client_flag: true
        status_code: 200

    # Rol separat, doar pentru SEMNAREA CSR-urilor primite de la clienți
    # externi (via "/sign", folosit de cert-manager - vezi
    # kubernetes_cluster/k3s/playbooks/16_configure_vault_pki_auth.yml), care
    # generează implicit chei RSA, nu EC. Nu poate fi ACELAȘI rol ca mai sus:
    # Vault respinge "key_type: any" pe endpoint-ul "/issue" ("role key type
    # \"any\" not allowed for issuing certificates, only signing") - verificat
    # practic, vezi documentația.
    - name: Creează/actualizează rolul de semnare "kube-dev-sign" pe intermediară
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki_int/roles/kube-dev-sign"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          allowed_domains: "{{ pki_domain }}"
          allow_subdomains: true
          allow_bare_domain: true
          max_ttl: "{{ pki_leaf_max_ttl }}"
          key_type: any
          server_flag: true
          client_flag: true
          # cert-manager (Gateway API) generează CSR-uri fără Common Name,
          # doar cu SAN-uri (norma actuală pentru certificate TLS) - Vault
          # respinge implicit un asemenea CSR ("common_name field is
          # required") dacă nu dezactivăm explicit cerința.
          require_cn: false
        status_code: 200

    # Policy minimă pentru cert-manager (via auth Kubernetes, vezi
    # kubernetes_cluster/k3s/playbooks/16_configure_vault_pki_auth.yml) -
    # permite DOAR semnarea prin rolul de mai sus, nimic altceva din Vault.
    - name: Creează policy-ul Vault pentru cert-manager (doar semnare certificate)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/policies/acl/cert-manager-pki"
        method: PUT
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          policy: |
            path "pki_int/sign/kube-dev-sign" {
              capabilities = ["create", "update"]
            }
        status_code: [200, 204]

    # Rădăcina (root CA) e singurul certificat pe care trebuie să-l aibă
    # încredere clienții din afara clusterului (git pe mașina de control,
    # containerd pe nodurile k3s) - intermediara e prezentată de fiecare
    # server, în lanț, odată cu certificatul lui. Suprascrie fișierul
    # folosit înainte pentru certificatul self-signed al GitLab - de-acum
    # e certificatul rădăcinii întregii infrastructuri, nu doar al GitLab.
    - name: Obține certificatul rădăcinii (PEM)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki/ca/pem"
        return_content: true
      register: root_ca_pem

    - name: Sincronizează certificatul rădăcinii pe mașina de control
      ansible.builtin.copy:
        content: "{{ root_ca_pem.content }}"
        dest: "{{ root_ca_file }}"
        mode: "0644"
      delegate_to: localhost
      become: false

    # Vault poate acum să-și emită propriul certificat (rădăcina și
    # intermediata există deja, mai sus) - listener-ul extern (0.0.0.0:8200)
    # trece de la HTTP la HTTPS. Listener-ul intern de bootstrap
    # (127.0.0.1:8201, folosit de acest playbook și de install_vault.yml)
    # rămâne neschimbat - vezi comentariul din install_vault.yml.
    - name: Verifică dacă Vault are deja propriul certificat
      ansible.builtin.stat:
        path: "{{ vault_config_dir }}/vault.crt"
      register: vault_own_cert_check

    - name: Emite certificatul Vault din propriul PKI (o singură dată)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki_int/issue/kube-dev"
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          common_name: vault.kube-dev.local
          ip_sans: "10.10.10.20,127.0.0.1"
        status_code: 200
      register: vault_cert_issue
      when: not vault_own_cert_check.stat.exists

    - name: Scrie certificatul Vault (leaf + intermediară)
      ansible.builtin.copy:
        content: "{{ vault_cert_issue.json.data.certificate }}\n{{ vault_cert_issue.json.data.issuing_ca }}"
        dest: "{{ vault_config_dir }}/vault.crt"
        owner: vault
        group: vault
        mode: "0644"
      when: vault_cert_issue is not skipped

    - name: Scrie cheia privată a certificatului Vault
      ansible.builtin.copy:
        content: "{{ vault_cert_issue.json.data.private_key }}"
        dest: "{{ vault_config_dir }}/vault.key"
        owner: vault
        group: vault
        mode: "0640"
      when: vault_cert_issue is not skipped
      no_log: true

    # Rescrie vault.hcl acum că certificatul există - identic cu logica din
    # install_vault.yml (duplicat intenționat: fiecare playbook rămâne
    # auto-conținut, fără fișiere de task-uri partajate, stilul deja
    # existent în proiect). La prima rulare a acestui playbook, fișierul e
    # rescris exact o dată, cu listener-ul extern HTTPS.
    - name: Comută listener-ul extern al Vault-ului pe HTTPS
      ansible.builtin.copy:
        content: |
          ui = true
          disable_mlock = true

          storage "file" {
            path = "{{ vault_data_dir }}"
          }

          listener "tcp" {
            address     = "127.0.0.1:8201"
            tls_disable = true
          }

          listener "tcp" {
            address       = "0.0.0.0:8200"
            tls_cert_file = "{{ vault_config_dir }}/vault.crt"
            tls_key_file  = "{{ vault_config_dir }}/vault.key"
          }

          api_addr = "https://10.10.10.20:8200"
        dest: "{{ vault_config_dir }}/vault.hcl"
        owner: vault
        group: vault
        mode: "0640"
      when: vault_cert_issue is not skipped
      register: vault_tls_config

    - name: Repornește Vault ca să preia listener-ul HTTPS
      ansible.builtin.systemd:
        name: vault
        state: restarted
      when: vault_tls_config.changed

    - name: Așteaptă ca Vault să răspundă pe HTTPS
      ansible.builtin.uri:
        url: "https://10.10.10.20:8200/v1/sys/health"
        validate_certs: false
        status_code: [200, 429, 472, 473, 501, 503]
      register: vault_https_health
      until: vault_https_health.status is defined
      retries: 15
      delay: 4
      when: vault_tls_config.changed

    # Repornirea de mai sus resigilează Vault (backend-ul "file" nu suportă
    # auto-unseal, exact ca la orice altă repornire - vezi install_vault.yml,
    # care rulează ÎNAINTE de acest playbook și nu mai are ocazia să
    # desigileze din nou după acest restart specific). Verificat
    # necondiționat (nu doar "dacă tocmai s-a schimbat configurația") - la
    # fel ca în install_vault.yml, în caz că Vault a rămas sigilat dintr-un
    # motiv complet diferit (repornire manuală, reboot al VM-ului, etc.).
    - name: Verifică dacă Vault e sigilat
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/seal-status"
        return_content: true
      register: vault_seal_status_after_tls

    - name: Desigilează (unseal) Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/unseal"
        method: PUT
        body_format: json
        body:
          key: "{{ (vault_root_read.content | b64decode | from_json)['keys'][0] }}"
        status_code: 200
      when: vault_seal_status_after_tls.json.sealed

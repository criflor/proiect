---
# Instalează și configurează serverul NFS pe VM-ul de suport, exportă
# /data/nfs (propriul volum LVM - vezi terraform/main.tf) DOAR către
# adresele IP ale nodurilor clusterului k3s, nu către întreg subnetul.
- name: Instalare și configurare server NFS
  hosts: suport
  become: true

  vars:
    nfs_export_path: /data/nfs
    # Adresele exacte ale nodurilor k3s (nu un wildcard de subnet) - acces
    # restricționat explicit, conform cerinței.
    nfs_allowed_clients:
      - 10.10.10.10 # k8s-master
      - 10.10.10.11 # k8s-worker1
      - 10.10.10.12 # k8s-worker2

  tasks:
    - name: Instalează pachetul serverului NFS
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true

    - name: Permisiuni pe directorul exportat (necesare pentru provisionerul dinamic din cluster)
      ansible.builtin.file:
        path: "{{ nfs_export_path }}"
        state: directory
        owner: nobody
        group: nogroup
        mode: "0777"

    - name: Configurează exportul NFS, restricționat la nodurile clusterului
      ansible.builtin.template:
        src: exports.j2
        dest: /etc/exports
        mode: "0644"
      notify: Reîncarcă exporturile NFS

    - name: Pornește și activează serviciul NFS
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: started
        enabled: true

  handlers:
    - name: Reîncarcă exporturile NFS
      ansible.builtin.command:
        cmd: exportfs -ra
      changed_when: true

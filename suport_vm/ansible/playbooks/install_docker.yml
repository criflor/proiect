---
# Instalează Docker Engine + plugin-ul Compose pe VM-ul de suport - necesar
# pentru a rula stack-ul SigNoz (cerința 10, monitorizare), care e distribuit
# oficial ca docker-compose, nu ca pachete individuale.
- name: Instalare Docker Engine (repo oficial)
  hosts: suport
  become: true

  tasks:
    - name: Verifică dacă Docker e deja instalat
      ansible.builtin.command:
        cmd: docker --version
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Instalează pachetele necesare pentru adăugarea repo-ului APT
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
      when: docker_check.rc != 0

    - name: Creează directorul pentru cheia GPG a repo-ului Docker
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: docker_check.rc != 0

    - name: Descarcă cheia GPG oficială Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: docker_check.rc != 0

    - name: Adaugă repo-ul APT oficial Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      when: docker_check.rc != 0

    - name: Instalează Docker Engine, CLI și plugin-ul Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
      when: docker_check.rc != 0

    - name: Adaugă userul admin în grupul docker (rulare fără sudo)
      ansible.builtin.user:
        name: admin
        groups: docker
        append: true

    - name: Mută directorul de date Docker pe discul LVM dedicat (/data/signoz)
      ansible.builtin.copy:
        content: |
          {
            "data-root": "/data/signoz/docker"
          }
        dest: /etc/docker/daemon.json
        mode: "0644"
      register: docker_daemon_config

    - name: Pornește și activează serviciul Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
        daemon_reload: true

    - name: Repornește Docker dacă directorul de date s-a schimbat
      ansible.builtin.systemd:
        name: docker
        state: restarted
      when: docker_daemon_config.changed

---
# Instalează provisionerul dinamic NFS (nfs-subdir-external-provisioner) și
# configurează StorageClass-ul "nfs" - odată instalat, orice PersistentVolumeClaim
# care cere storageClassName: nfs primește automat un PersistentVolume nou
# (un subdirector pe exportul NFS de pe suport-vm), fără intervenție manuală.
#
# Baza de date (Postgres) rămâne pe StorageClass-ul "local-path" (vezi
# apps/demo_app/k8s/postgres.yaml) - NFS nu e recomandat pentru fișierele de
# date ale unei baze relaționale (probleme cunoscute de locking/performanță);
# "nfs" e destinat nevoilor de stocare ale aplicației în sine.
- name: Instalare StorageClass NFS
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    kubeconfig: "{{ local_kubeconfig_path }}"
    nfs_server: 10.10.10.20
    nfs_path: /data/nfs

  environment:
    KUBECONFIG: "{{ kubeconfig }}"

  tasks:
    - name: Adaugă/actualizează repo-ul Helm al provisionerului NFS
      ansible.builtin.command:
        cmd: helm repo add nfs-subdir-external-provisioner https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"

    - name: Instalează/actualizează provisionerul NFS via Helm
      ansible.builtin.command:
        cmd: >
          helm upgrade --install nfs-subdir-external-provisioner
          nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
          --namespace nfs-provisioner
          --create-namespace
          --set nfs.server={{ nfs_server }}
          --set nfs.path={{ nfs_path }}
          --set storageClass.name=nfs
          --set storageClass.defaultClass=false
          --set storageClass.reclaimPolicy=Retain
      register: nfs_helm
      changed_when: "'has been upgraded' in nfs_helm.stdout or 'has been installed' in nfs_helm.stdout"

    - name: Așteaptă ca provisionerul să fie disponibil
      ansible.builtin.command:
        cmd: kubectl -n nfs-provisioner rollout status deployment/nfs-subdir-external-provisioner --timeout=120s
      changed_when: false

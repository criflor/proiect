---
# Copiază kubeconfig-ul generat de server pe mașina de control, cu adresa
# reală a serverului (nu 127.0.0.1) și contextul redenumit după numele
# clusterului (kube-dev). NU se scrie în repo - vezi .gitignore.
#
# Doar de pe primul nod (deterministic) - în topologia HA toate nodurile
# sunt server și oricare răspunde identic la API, dar preluarea de pe toate
# ar rescrie fișierul de 3 ori degeaba, cu IP-ul ultimului nod procesat.
- name: Preluare kubeconfig pentru cluster
  hosts: "{{ groups['k3s_server'][0] }}"
  become: true

  tasks:
    - name: Asigură existența directorului ~/.kube pe mașina de control
      ansible.builtin.file:
        path: "~/.kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Citește kubeconfig-ul generat de server
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_raw

    - name: Scrie kubeconfig-ul local, cu IP-ul real al serverului
      ansible.builtin.copy:
        content: >-
          {{
            (k3s_kubeconfig_raw.content | b64decode)
            | replace('127.0.0.1', ansible_host)
            | replace('default', cluster_name)
          }}
        dest: "{{ local_kubeconfig_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

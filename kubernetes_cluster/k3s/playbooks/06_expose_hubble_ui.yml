---
# Expune Hubble UI permanent prin Gateway-ul clusterului (HTTPS), în locul
# unui kubectl port-forward ad-hoc.
- name: Expunere Hubble UI prin Gateway
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    kubeconfig: "{{ local_kubeconfig_path }}"

  environment:
    KUBECONFIG: "{{ kubeconfig }}"

  tasks:
    - name: Aplică HTTPRoute pentru Hubble UI
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ playbook_dir }}/../files/hubble-ui-httproute.yaml"
      register: hubble_route_apply
      changed_when: "'unchanged' not in hubble_route_apply.stdout"

    - name: Afișează adresa Hubble UI
      ansible.builtin.debug:
        msg: >-
          Hubble UI e disponibil la https://hubble.kube-dev.local/ - dacă nu
          rezolvă, rulează "sudo ./setup_hosts.sh" din rădăcina proiectului
          (înainte de install.sh, sau oricând ulterior).

---
# Instalează External Secrets Operator (ESO) - controller care citește
# secretele aplicației demo direct din Vault și materializează Secret-uri
# Kubernetes native (`postgres-credentials`, `demo-app-secret`), fără ca
# valorile lor să mai fie generate/scrise manual de un playbook Ansible
# (vezi 07_deploy_demo_app.yml, care de-acum DOAR populează Vault, nu mai
# atinge deloc obiecte Kubernetes). Manifestele `ExternalSecret` conțin doar
# CALEA din Vault (nimic sensibil), deci pot fi comitate în git și
# sincronizate de Argo CD ca orice altă resursă (apps/demo_app/k8s/base/).
#
# Numerotat 17 (adăugat ulterior), dar trebuie să ruleze devreme - vezi
# ordinea reală de import din site.yml: imediat după autentificarea
# Kubernetes a Vault-ului (16), cu mult înainte de Argo CD (13), care
# sincronizează ExternalSecret-urile demo-app.
- name: Instalare External Secrets Operator
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    kubeconfig: "{{ local_kubeconfig_path }}"
    eso_namespace: external-secrets
    eso_service_account: external-secrets
    vault_role_name: external-secrets
    vault_policy_name: external-secrets-demo-app
    root_ca_file: "{{ playbook_dir }}/../files/gitlab-kube-dev-local-ca.crt"

  environment:
    KUBECONFIG: "{{ kubeconfig }}"

  tasks:
    - name: Adaugă/actualizează repo-ul Helm al External Secrets Operator
      ansible.builtin.command:
        cmd: helm repo add external-secrets https://charts.external-secrets.io
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"

    - name: Instalează/actualizează External Secrets Operator via Helm
      ansible.builtin.command:
        cmd: >
          helm upgrade --install external-secrets external-secrets/external-secrets
          --namespace {{ eso_namespace }}
          --create-namespace
      register: eso_helm
      changed_when: "'has been upgraded' in eso_helm.stdout or 'has been installed' in eso_helm.stdout"

    - name: Așteaptă ca operatorul ESO să fie disponibil
      ansible.builtin.command:
        cmd: kubectl -n {{ eso_namespace }} rollout status deployment/external-secrets --timeout=180s
      changed_when: false

    # Deployment SEPARAT (același chart Helm) - validarea CRD-urilor
    # ExternalSecret/ClusterSecretStore trece prin webhook-ul acestui pod, nu
    # prin controller-ul principal de mai sus. Fără această așteptare
    # explicită, primul "kubectl apply" pe ClusterSecretStore poate ajunge
    # înaintea lui, cu eroarea "no endpoints available for service
    # external-secrets-webhook" - verificat practic, la o instalare de la
    # zero (controller-ul principal devenise deja disponibil, webhook-ul încă
    # nu terminase de pornit).
    - name: Așteaptă ca webhook-ul ESO să fie disponibil
      ansible.builtin.command:
        cmd: kubectl -n {{ eso_namespace }} rollout status deployment/external-secrets-webhook --timeout=180s
      changed_when: false

    - name: Citește tokenul root Vault
      ansible.builtin.slurp:
        src: "{{ vault_init_file }}"
      register: vault_root_read

    # Doar citire, doar sub prefixul secretelor demo-app - ESO nu are nevoie
    # (și nu primește) acces la restul secretelor din Vault (GitLab, SigNoz
    # etc).
    - name: Creează/actualizează policy-ul Vault "{{ vault_policy_name }}"
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/policies/acl/{{ vault_policy_name }}"
        validate_certs: false
        method: PUT
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          policy: |
            path "secret/data/demo-app/*" {
              capabilities = ["read"]
            }
        status_code: [200, 204]

    # Metoda de autentificare Kubernetes e deja activată în Vault (vezi
    # 16_configure_vault_pki_auth.yml, pentru cert-manager) - se adaugă doar
    # un rol nou, legat STRICT de ServiceAccount-ul ESO.
    - name: Creează/actualizează rolul Vault "{{ vault_role_name }}"
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/kubernetes/role/{{ vault_role_name }}"
        validate_certs: false
        method: POST
        headers:
          X-Vault-Token: "{{ (vault_root_read.content | b64decode | from_json).root_token }}"
        body_format: json
        body:
          bound_service_account_names: "{{ eso_service_account }}"
          bound_service_account_namespaces: "{{ eso_namespace }}"
          token_policies: "{{ vault_policy_name }}"
          ttl: 20m
        status_code: [200, 204]

    # Spre deosebire de cert-manager (a cărui CRD Vault Issuer acceptă DOAR
    # un token static prin "secretRef" - limitare a CRD-ului, nu alegere),
    # ClusterSecretStore-ul ESO suportă nativ "serviceAccountRef": ESO cere
    # singur, la fiecare sincronizare, un token JWT proaspăt (de scurtă
    # durată) pentru propriul ServiceAccount, via API-ul Kubernetes
    # TokenRequest - fără niciun token Vault static de gestionat/reînnoit.
    - name: Aplică ClusterSecretStore-ul (Vault, autentificare Kubernetes nativă)
      ansible.builtin.shell:
        cmd: |
          cat <<EOF | kubectl apply -f -
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata:
            name: vault-backend
          spec:
            provider:
              vault:
                server: "{{ vault_addr }}"
                path: "secret"
                version: "v2"
                caBundle: {{ lookup('file', root_ca_file) | b64encode }}
                auth:
                  kubernetes:
                    mountPath: "kubernetes"
                    role: "{{ vault_role_name }}"
                    serviceAccountRef:
                      name: {{ eso_service_account }}
                      namespace: {{ eso_namespace }}
          EOF
      register: secretstore_apply
      changed_when: "'unchanged' not in secretstore_apply.stdout"

    - name: Așteaptă ca ClusterSecretStore-ul să devină "Valid"
      ansible.builtin.command:
        cmd: kubectl get clustersecretstore vault-backend -o jsonpath={.status.conditions[0].reason}
      register: secretstore_ready
      until: secretstore_ready.stdout == "Valid"
      retries: 12
      delay: 5
      changed_when: false

[defaults]
# Reutilizează inventarul generat de Terraform (adrese IP) și adaugă grupurile
# de rol (server/agent) definite local, specifice instalării k3s.
inventory = ../ansible/inventory.ini,./inventory.ini
host_key_checking = False
remote_user = adm
private_key_file = ~/.ssh/id_rsa
retry_files_enabled = False
interpreter_python = /usr/bin/python3

[privilege_escalation]
become = True
become_method = sudo

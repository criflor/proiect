# Expune UI-ul Argo CD prin Gateway-ul existent (același tipar ca Hubble UI),
# folosind certificatul deja emis pentru "*.kube-dev.local".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: kube-dev-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - "argocd.kube-dev.local"
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
